<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mission Control — Faz 0</title>
<style>
  :root {
    --bg: #0f1117; --card: #181b23; --border: #2a2e3a; --text: #e8eaf0;
    --muted: #8b90a0; --accent: #6ea8fe; --ok: #4ade80; --warn: #f87171;
    --chip: #232733;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, sans-serif;
    max-width: 760px; margin-inline: auto; padding: 2rem 1rem 4rem;
  }
  h1 { font-size: 1.2rem; margin: 0 0 1rem; }
  form { display: flex; gap: .5rem; margin-bottom: .75rem; }
  input[type="text"] {
    flex: 1; padding: .6rem .8rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
  }
  button {
    padding: .6rem 1rem; border-radius: 8px; border: none;
    background: var(--accent); color: #0b0d12; font-weight: 600; cursor: pointer;
  }
  select {
    padding: .6rem .5rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text);
  }
  .badge {
    font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    padding: .15em .5em; border-radius: 5px; vertical-align: middle;
    background: var(--chip); color: var(--muted); border: 1px solid var(--border);
  }
  .badge.live { color: var(--ok); border-color: var(--ok); }
  .badge.mock { color: var(--warn); border-color: var(--warn); }
  .toggle { display: flex; align-items: center; gap: .4rem; color: var(--muted); font-size: .85rem; margin-bottom: 1rem; }
  #phase { font-weight: 600; color: var(--accent); margin-bottom: 1rem; min-height: 1.4em; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: .7rem .9rem; margin-bottom: .6rem;
  }
  .card .who { font-size: .8rem; color: var(--muted); margin-bottom: .2rem; }
  .card .summary { margin-bottom: .35rem; }
  .card .summary .label {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); border: 1px solid var(--border); border-radius: 4px;
    padding: 0 .3em; margin-right: .4em; vertical-align: middle;
  }
  .chips { display: flex; flex-wrap: wrap; gap: .35rem; }
  .chip {
    background: var(--chip); border-radius: 6px; padding: .1rem .5rem;
    font-size: .78rem; color: var(--text); font-variant-numeric: tabular-nums;
  }
  .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); }
  .advanced-only { display: none; }
  body.advanced .advanced-only { display: inline-flex; }
  body.advanced .card .who .model { display: inline; }
  .card .who .model { display: none; color: var(--accent); }
</style>
</head>
<body>
  <h1>Mission Control <span id="mode-badge" class="badge">…</span></h1>

  <form id="goal-form">
    <input id="goal" type="text" placeholder="What do you want to accomplish?"
           value="Fix the failing tests." />
    <select id="project" title="Project to work on"></select>
    <button type="submit">Start</button>
  </form>
  <label class="toggle">
    <input type="checkbox" id="advanced" /> Advanced view (agents, models, tokens, cost)
  </label>

  <div id="phase"></div>
  <div id="timeline"></div>

<script>
  // §5.4: varsayılan görünüm faz dilinde; agent/model detayı advanced'te.
  const PHASES = {
    "mission.created": "Planning", "plan.proposed": "Planning",
    "plan.approved": "Building", "task.assigned": "Building", "agent.status": "Building",
    "artifact.created": "Building", "verification.run": "Testing",
    "failure.detected": "Fixing", "failure.explained": "Fixing", "fix.requested": "Fixing",
    "review.completed": "Reviewing", "deliverable.published": "Done",
    "mission.completed": "Done", "mission.suspended": "Needs your help",
    "mission.failed": "Failed", "mission.cancelled": "Cancelled",
  };
  const ROLE_LABEL = { manager: "Planner", developer: "Builder", debugger: "Debugger", reviewer: "Reviewer" };

  const timeline = document.getElementById("timeline");
  const phaseEl = document.getElementById("phase");
  document.getElementById("advanced").addEventListener("change", (e) =>
    document.body.classList.toggle("advanced", e.target.checked));

  // Mod rozeti: mock ile üretilmiş bir timeline asla gerçek model çalışmış
  // gibi sunulmaz — ürünün güven sözleşmesi bunu yasaklar.
  fetch("/config").then((r) => r.json()).then((cfg) => {
    const badge = document.getElementById("mode-badge");
    badge.textContent = cfg.mode === "live" ? `live · ${cfg.model}` : "mock model";
    badge.className = `badge ${cfg.mode}`;
    badge.title = cfg.mode === "live"
      ? "Real model calls are being made and billed."
      : "No API key configured — a scripted stand-in model is driving the agent loop.";
    const select = document.getElementById("project");
    select.innerHTML = cfg.projects.map((p) => `<option value="${p}">${p}</option>`).join("");
  });

  let source = null;
  document.getElementById("goal-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    timeline.innerHTML = ""; phaseEl.textContent = "Starting…";
    if (source) source.close();
    const res = await fetch("/missions", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({
        goal: document.getElementById("goal").value,
        project: document.getElementById("project").value,
      }),
    });
    const { missionId } = await res.json();
    source = new EventSource(`/missions/${missionId}/stream`);
    source.onmessage = (msg) => render(JSON.parse(msg.data));
  });

  function chip(text, cls) {
    return `<span class="chip ${cls || ""}">${text}</span>`;
  }

  function factChips(f) {
    if (!f) return "";
    const chips = [];
    if (f.changes) chips.push(chip(`${f.changes.files} files · +${f.changes.added}/−${f.changes.removed}`));
    if (f.commands) chips.push(chip(`${f.commands.length} command${f.commands.length > 1 ? "s" : ""}`));
    if (f.verification) {
      const v = f.verification;
      chips.push(chip(`tests: ${v.passed} passed / ${v.failed} failed`, v.failed ? "warn" : "ok"));
    }
    if (f.durationMs != null) chips.push(chip(formatDuration(f.durationMs)));
    if (f.costUsd != null) chips.push(chip(`$${f.costUsd.toFixed(2)}`, "advanced-only"));
    if (f.tokens) chips.push(chip(`${(f.tokens.input / 1000).toFixed(1)}k in / ${f.tokens.output} out tok`, "advanced-only"));
    return chips.join("");
  }

  function formatDuration(ms) {
    const s = Math.round(ms / 1000);
    return s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`;
  }

  function render(ev) {
    const phase = PHASES[ev.kind];
    if (phase) phaseEl.textContent = phase;

    // Kullanıcıya gürültü olan salt-sistem adımlarını basit görünümde katlama:
    // Faz 0'da hepsini gösteriyoruz; facts'i olmayan execution.step'ler zaten yok.
    const who = ev.actor.type === "agent"
      ? `Your AI team — ${ROLE_LABEL[ev.actor.role] || ev.actor.role} <span class="model">(${ev.actor.model || "?"})</span>`
      : ev.actor.type === "user" ? "You" : "System";

    const summary = ev.aiSummary
      ? `<div class="summary">${ev.actor.type === "agent" ? '<span class="label">AI summary</span>' : ""}${escapeHtml(ev.aiSummary)}</div>`
      : "";

    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="who">${who} · <span>${ev.kind}</span></div>
      ${summary}
      <div class="chips">${factChips(ev.facts)}</div>`;
    timeline.appendChild(el);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }
</script>
</body>
</html>
